name: Android

on:
  push:
    branches: [main, master]
    tags: ['v*', 'chat-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APKs
        run: gradle :app:assembleDebug :chat-app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            chat-app/build/outputs/apk/debug/*.apk

      - name: Publish APKs
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Release signing is not configured yet"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" --title "StreamHata Android $GITHUB_REF_NAME"
          fi
          find app/build/outputs/apk/debug chat-app/build/outputs/apk/debug -name '*.apk' -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
