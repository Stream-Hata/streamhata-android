name: Android

on:
  push:
    branches: [main, master]
    tags: ['v*', 'chat-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          sdk="$HOME/android-sdk"
          mkdir -p "$sdk/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$sdk/cmdline-tools"
          mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          export ANDROID_HOME="$sdk"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" >/dev/null

      - name: Install Gradle
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APKs
        run: |
          set +e
          gradle :app:assembleDebug :chat-app:assembleDebug --no-daemon --stacktrace > build.log 2>&1
          status=$?
          grep -n -A8 -B2 -E "What went wrong|FAILURE|Caused by|SDK location|Failed to|error:" build.log | head -120 | while IFS= read -r line; do echo "::error title=Gradle::${line}"; done
          cat build.log
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            chat-app/build/outputs/apk/debug/*.apk

      - name: Publish APKs
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Release signing is not configured yet"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" --title "StreamHata Android $GITHUB_REF_NAME"
          fi
          find app/build/outputs/apk/debug chat-app/build/outputs/apk/debug -name '*.apk' -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
